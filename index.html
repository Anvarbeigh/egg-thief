<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Egg Thief</title>
<style>
  @font-face { font-family: Rubik; font-weight: 300 900; font-display: swap; src: url(./assets/fonts/rubik-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Rubik; font-weight: 300 900; font-display: swap; src: url(./assets/fonts/rubik-cyrillic.woff2) format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  :root {
    --gold: #ffc531; --ink: #20263a; --panel: #2a3352; --panel2: #3a4570; --line: rgba(255,255,255,.14);
    --green: #3fcf5e; --green-d: #23913c; --blue: #3aa0ff; --blue-d: #1d67c2; --orange: #ff9d2e; --orange-d: #c4610c;
    --pink: #ff5fa2; --pink-d: #b8306c; --purple: #9b5cff; --purple-d: #6630c4; --red: #ff5a5a; --red-d: #b52b2b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #8fd0ff; font-family: Rubik, "Trebuchet MS", system-ui, sans-serif; touch-action: none; color: #fff; }
  canvas#game { display: block; width: 100%; height: 100%; }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  /* chunky buttons */
  .btn { border: 0; border-radius: 16px; padding: 10px 16px; font-weight: 800; font-size: 17px; color: #fff; cursor: pointer; position: relative;
         background: var(--c, var(--blue)); box-shadow: 0 5px 0 var(--d, var(--blue-d)), 0 8px 14px rgba(0,0,0,.25); text-shadow: 0 2px 0 rgba(0,0,0,.25);
         transition: transform .06s, filter .15s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--d, var(--blue-d)); }
  .btn:disabled { filter: grayscale(.85) brightness(.75); cursor: default; }
  .btn.green { --c: var(--green); --d: var(--green-d); } .btn.orange { --c: var(--orange); --d: var(--orange-d); }
  .btn.pink { --c: var(--pink); --d: var(--pink-d); } .btn.purple { --c: var(--purple); --d: var(--purple-d); } .btn.red { --c: var(--red); --d: var(--red-d); }

  /* loading + title */
  #loader, #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; z-index: 30; }
  #loader { background: linear-gradient(#7cc8ff, #b9e6ff); }
  .logo { font-size: clamp(42px, 9vw, 84px); font-weight: 900; letter-spacing: 1px; line-height: .95; color: #fff;
          text-shadow: 0 6px 0 #2d7fe0, 0 10px 0 #1b4f99, 0 16px 24px rgba(0,0,0,.35); transform: rotate(-3deg); }
  .logo .egg { display: inline-block; animation: wob 1.4s ease-in-out infinite; }
  @keyframes wob { 0%,100% { transform: rotate(-10deg) } 50% { transform: rotate(10deg) } }
  #bar { width: min(360px, 80vw); height: 22px; border-radius: 12px; background: rgba(0,0,0,.25); overflow: hidden; border: 3px solid #fff; }
  #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffd84a, #ff9d2e); transition: width .2s; }
  #start { background: linear-gradient(rgba(10,20,50,.38), rgba(10,20,50,0) 28%, rgba(10,20,50,0) 68%, rgba(10,20,50,.5)); }
  #start p { margin: 0; max-width: 560px; font-size: 18px; font-weight: 600; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  #start .small { font-size: 14px; opacity: .9; font-weight: 500; }
  #btnPlay { font-size: 32px; padding: 16px 56px; border-radius: 22px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 2px 0 rgba(0,0,0,.35); z-index: 10; }
  #stats { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .chip { background: rgba(20,28,55,.55); border: 2px solid rgba(255,255,255,.18); border-radius: 16px; padding: 5px 12px 5px 6px; font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(4px); }
  .chip .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: rgba(255,255,255,.15); }
  #coinChip { font-size: 26px; color: var(--gold); padding-right: 16px; }
  #coinChip .ic { width: 38px; height: 38px; font-size: 24px; background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc531 55%, #d68a00); }
  #coinChip.bump { animation: bump .25s; }
  @keyframes bump { 50% { transform: scale(1.12) } }
  .cn { display: inline-block; width: 1em; height: 1em; border-radius: 50%; vertical-align: -0.14em; margin: 0 .08em;
        background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc531 55%, #d68a00); box-shadow: inset 0 0 0 .09em #c47a00, 0 .06em 0 rgba(0,0,0,.35); }
  .chip small { font-size: 13px; opacity: .85; }
  #side { position: absolute; right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 10px; pointer-events: auto; align-items: flex-end; }
  .sbtn { width: 64px; height: 64px; border-radius: 18px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 26px; line-height: 1; }
  .sbtn span { font-size: 10px; font-weight: 800; margin-top: 3px; letter-spacing: .2px; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot::after { content: ""; position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; border-radius: 50%; background: #ff3b3b; border: 3px solid #fff; animation: pulse 1s infinite; }
  #gear { width: 44px; height: 44px; font-size: 20px; border-radius: 14px; --c: rgba(20,28,55,.6); --d: rgba(0,0,0,.3); }

  #tut { position: absolute; left: 50%; transform: translateX(-50%); top: max(12px, env(safe-area-inset-top)); max-width: min(560px, calc(100vw - 200px)); pointer-events: auto;
         background: linear-gradient(#ffe066, #ffbf2e); color: #4a2a00; text-shadow: none; font-weight: 800; font-size: 17px; padding: 10px 18px; border-radius: 18px;
         box-shadow: 0 5px 0 #c98a00, 0 10px 20px rgba(0,0,0,.25); text-align: center; animation: tutIn .4s; z-index: 1; }
  #tut small { display: block; font-size: 12px; font-weight: 600; opacity: .8; margin-top: 2px; }
  #tut .skip { margin-left: 10px; border: 0; border-radius: 10px; padding: 3px 9px; font-weight: 800; font-size: 12px; background: rgba(0,0,0,.18); color: #4a2a00; cursor: pointer; pointer-events: auto; vertical-align: middle; }
  @keyframes tutIn { from { translate: 0 -20px; opacity: 0 } }
  #zonehint { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%); text-align: center; font-weight: 800; font-size: 18px;
              background: rgba(20,28,55,.6); padding: 6px 16px; border-radius: 14px; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #zonehint.show { opacity: 1; } #zonehint.bad { color: #ff8a8a; } #zonehint.ok { color: #9dff9d; }
  #carry { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 22px; background: rgba(255,90,90,.85);
           padding: 10px 22px; border-radius: 18px; display: none; animation: pulse .8s infinite; box-shadow: 0 5px 0 #a32828; }
  #msgs { display: contents; }
  #toasts { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .toast { font-weight: 900; font-size: 26px; padding: 6px 18px; border-radius: 14px; background: rgba(20,28,55,.6); animation: pop 2.2s forwards; white-space: nowrap; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 10% { transform: scale(1.08); opacity: 1 } 18% { transform: scale(1) } 80% { opacity: 1 } 100% { opacity: 0; transform: translateY(-30px) } }
  #vig { position: fixed; inset: 0; pointer-events: none; z-index: 6; background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(8,18,48,.30) 100%); }
  #flash { position: fixed; inset: 0; background: #ff3030; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 11; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 11; }

  /* touch controls: the joystick appears where the left thumb lands */
  #touchzone { position: absolute; left: 0; bottom: 0; width: 50%; height: 65%; pointer-events: auto; display: none; touch-action: none; }
  #joy { position: absolute; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; background: rgba(255,255,255,.16); border: 3px solid rgba(255,255,255,.4); display: none; pointer-events: none; }
  #joy.idle { display: block; left: 110px; bottom: 60px; top: auto; margin: 0; opacity: .55; }
  #joyknob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 3px 8px rgba(0,0,0,.3); }
  #jumpbtn { position: absolute; right: max(26px, env(safe-area-inset-right)); bottom: max(36px, env(safe-area-inset-bottom)); width: 96px; height: 96px; border-radius: 50%; font-size: 16px;
             pointer-events: auto; display: none; touch-action: none; --c: rgba(255,255,255,.28); --d: rgba(0,0,0,.25); }
  body.touch #touchzone, body.touch #jumpbtn { display: block; }
  body.touch #carry { bottom: 150px; }

  /* panels */
  .panel { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8,12,30,.5); pointer-events: auto; z-index: 20; padding: 12px; }
  .panel.open { display: flex; animation: fadeIn .15s; }
  @keyframes fadeIn { from { opacity: 0 } }
  .box { background: linear-gradient(var(--panel2), var(--panel)); border-radius: 26px; padding: 16px; width: min(580px, 100%); max-height: calc(100% - 10px); overflow: auto;
         border: 4px solid rgba(255,255,255,.18); box-shadow: 0 14px 40px rgba(0,0,0,.4); animation: boxIn .2s cubic-bezier(.2,1.6,.4,1); }
  @keyframes boxIn { from { transform: scale(.85) } }
  .box h2 { margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 900; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .box h2 .btn { padding: 6px 12px; font-size: 18px; min-width: 44px; min-height: 42px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 16px; background: rgba(255,255,255,.08); margin-bottom: 8px; border: 2px solid transparent; }
  .row .ico { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; font-size: 28px; background: rgba(255,255,255,.12); flex: none; }
  .row .txt { flex: 1; min-width: 0; }
  .row .txt b { display: block; font-size: 17px; }
  .row .txt span { font-size: 13px; opacity: .8; }
  .row .btn { padding: 9px 13px; font-size: 15px; white-space: nowrap; }
  .empty { opacity: .75; text-align: center; padding: 22px; font-weight: 600; }
  .note { font-size: 14px; opacity: .85; margin: 6px 2px 12px; font-weight: 500; line-height: 1.4; }
  .big { font-size: 20px; padding: 14px 22px; width: 100%; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .cell { border-radius: 14px; padding: 8px 4px; text-align: center; background: rgba(255,255,255,.08); font-size: 12px; font-weight: 700; border: 2px solid var(--rc, transparent); }
  .cell .em { font-size: 30px; display: block; margin-bottom: 2px; }
  .cell.locked { opacity: .45; filter: grayscale(1); }
  .cell .gd { color: var(--gold); font-size: 11px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 8px 0 12px; }
  .day { border-radius: 12px; background: rgba(255,255,255,.08); padding: 8px 2px; text-align: center; font-size: 11px; font-weight: 800; }
  .day.got { background: rgba(63,207,94,.35); } .day.now { background: rgba(255,197,49,.4); outline: 3px solid var(--gold); }
  .toggle { display: flex; justify-content: space-between; align-items: center; }

  /* hatch reveal */
  #reveal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 25; pointer-events: none; background: rgba(8,12,30,.35); }
  #reveal.open { display: flex; }
  #reveal .rays { position: absolute; width: 640px; height: 640px; border-radius: 50%; background: repeating-conic-gradient(var(--rc) 0 10deg, transparent 10deg 20deg); opacity: .35; animation: spin 8s linear infinite;
                  mask: radial-gradient(circle, #000 20%, transparent 70%); -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%); }
  @keyframes spin { to { transform: rotate(360deg) } }
  #reveal .card { position: relative; text-align: center; animation: cardIn .45s cubic-bezier(.2,1.8,.4,1); }
  @keyframes cardIn { from { transform: scale(.2) rotate(-12deg); opacity: 0 } }
  #reveal .rname { font-size: clamp(30px, 7vw, 54px); font-weight: 900; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
  #reveal .rrar { display: inline-block; font-size: 20px; font-weight: 900; padding: 4px 16px; border-radius: 12px; background: var(--rc); box-shadow: 0 4px 0 rgba(0,0,0,.3); margin: 6px 0; }
  #reveal .rinc { font-size: 22px; font-weight: 800; color: var(--gold); }
  #reveal .rnew { position: absolute; top: -34px; right: 0; background: #ff3b3b; padding: 4px 12px; border-radius: 12px; font-weight: 900; transform: rotate(12deg); box-shadow: 0 4px 0 #a32828; }
  #reveal .tap { margin-top: 14px; font-size: 14px; opacity: .8; }

  @media (max-width: 640px), (max-height: 480px) {
    .chip { font-size: 15px; } #coinChip { font-size: 20px; } #coinChip .ic { width: 30px; height: 30px; font-size: 18px; } .chip .ic { width: 24px; height: 24px; font-size: 14px; }
    .sbtn { width: 54px; height: 54px; font-size: 22px; border-radius: 15px; } .sbtn span { font-size: 9px; }
    /* small screens: tutorial, zone hint and "run home" stack in one column that never touches the side buttons */
    #msgs { display: flex; position: absolute; flex-direction: column; align-items: stretch; gap: 6px;
            top: calc(104px + env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); right: calc(76px + env(safe-area-inset-right)); }
    #msgs > * { position: static; transform: none; max-width: none; width: auto; text-align: center; }
    #tut { font-size: 13px; padding: 6px 10px; border-radius: 14px; box-shadow: 0 3px 0 #c98a00; background: linear-gradient(rgba(255,224,102,.92), rgba(255,191,46,.92)); }
    #zonehint { font-size: 12px; white-space: normal; padding: 4px 10px; }
    #zonehint:not(.show) { display: none; }
    #carry { font-size: 13px; padding: 5px 10px; animation: none; box-shadow: 0 3px 0 #a32828; }
    #tut:not(.hidden) ~ #carry { display: none !important; }
    #stats { gap: 4px; }
    .chip { font-size: 13px; padding: 3px 9px 3px 4px; border-radius: 13px; gap: 5px; }
    #coinChip { font-size: 17px; padding-right: 11px; }
    #coinChip .ic { width: 24px; height: 24px; font-size: 15px; } .chip .ic { width: 20px; height: 20px; font-size: 12px; }
    #toasts { top: 58%; }
    .toast { font-size: 18px; white-space: normal; text-align: center; max-width: calc(100vw - 32px); }
    #side { gap: 8px; }
  }
  /* phones held sideways: the stack goes to the top centre, the jump button moves left of the side buttons */
  @media (max-height: 480px) {
    .sbtn { width: 48px; height: 48px; } .sbtn span { display: none; } #side { gap: 6px; }
    #msgs { top: max(8px, env(safe-area-inset-top)); left: calc(124px + env(safe-area-inset-left)); right: calc(72px + env(safe-area-inset-right)); }
    #jumpbtn { width: 80px; height: 80px; right: calc(72px + env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); }
    #toasts { top: auto; bottom: 30%; }
    .logo { font-size: clamp(30px, 14vh, 64px); } #start { gap: 10px; padding: 12px; } #btnPlay { font-size: 26px; padding: 10px 44px; }
  }
  /* very short screens (landscape phone + sticky banner): side buttons in two columns */
  @media (max-height: 340px) {
    #side { flex-wrap: wrap-reverse; max-height: calc(100% - 16px); align-content: flex-start; }
    #side { flex-direction: column; }
    #msgs { right: calc(126px + env(safe-area-inset-right)); }
    #jumpbtn { width: 70px; height: 70px; right: calc(126px + env(safe-area-inset-right)); font-size: 13px; }
    #start p { font-size: 14px; } #start .small { display: none; }
  }
</style>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<script>window.PLATFORM = "poki";</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="fade"></div>

<div id="hud" class="hidden">
  <div id="stats">
    <div class="chip" id="coinChip"><span class="ic"></span><span id="coins">0</span></div>
    <div class="chip"><span class="ic">💰</span><span id="income">0</span><small data-t="perSec"></small></div>
    <div class="chip hidden"><span class="ic">👟</span><span id="speed">8</span></div>
    <div class="chip hidden" id="rbChip"><span class="ic">🌀</span><span id="rbText"></span></div>
  </div>
  <div id="msgs"><div id="tut" class="hidden"></div><div id="zonehint"></div><div id="carry"></div></div>
  <div id="toasts"></div>
  <div id="touchzone"><div id="joy"><div id="joyknob"></div></div></div>
  <button class="btn" id="jumpbtn" data-t="jump"></button>
  <div id="side">
    <button class="btn sbtn orange" id="btnShop">🛒<span data-t="shop"></span></button>
    <button class="btn sbtn green" id="btnPets">🐾<span data-t="pets"></span></button>
    <button class="btn sbtn purple" id="btnIndex">📖<span data-t="sideIndex"></span></button>
    <button class="btn sbtn pink" id="btnGift">🎁<span data-t="gift"></span></button>
    <button class="btn sbtn" id="btnRebirth">🌀<span data-t="sideRebirth"></span></button>
    <button class="btn" id="gear">⚙️</button>
  </div>
</div>

<div class="panel" id="shopPanel"><div class="box"><h2><span>🛒 <span data-t="shop"></span></span><button class="btn red" data-close>✕</button></h2><div id="shopList"></div></div></div>
<div class="panel" id="petsPanel"><div class="box"><h2><span>🐾 <span data-t="yourPens"></span></span><button class="btn red" data-close>✕</button></h2><div id="petsList"></div></div></div>
<div class="panel" id="indexPanel"><div class="box"><h2><span>📖 <span data-t="indexTitle"></span></span><button class="btn red" data-close>✕</button></h2><div class="note" id="indexNote"></div><div class="grid" id="indexGrid"></div></div></div>
<div class="panel" id="rebirthPanel"><div class="box"><h2><span>🌀 <span data-t="rebirthTitle"></span></span><button class="btn red" data-close>✕</button></h2><div id="rebirthBody"></div></div></div>
<div class="panel" id="giftPanel"><div class="box"><h2><span>🎁 <span data-t="giftTitle"></span></span><button class="btn red" data-close>✕</button></h2><div id="giftBody"></div></div></div>
<div class="panel" id="awayPanel"><div class="box" style="text-align:center"><h2 style="justify-content:center">💤 <span data-t="away"></span></h2><div id="awayBody"></div></div></div>
<div class="panel" id="caughtPanel"><div class="box" style="text-align:center"><h2 style="justify-content:center;gap:8px">😵 <span data-t="caughtTitle"></span></h2><p class="note" data-t="caughtText"></p><button class="btn green" id="btnCaughtOk" data-t="continue" style="font-size:22px;padding:12px 40px"></button></div></div>
<div class="panel" id="settingsPanel"><div class="box"><h2><span>⚙️ <span data-t="settings"></span></span><button class="btn red" data-close>✕</button></h2><div id="settingsBody"></div></div></div>

<div id="reveal"><div class="rays"></div><div class="card"><div class="rnew hidden" data-t="newPet"></div><div class="rname"></div><div class="rrar"></div><div class="rinc"></div></div></div>

<div id="start" class="hidden">
  <div class="logo" id="logo"></div>
  <p data-t="tagline"></p>
  <button class="btn green" id="btnPlay">▶ <span data-t="play"></span></button>
  <p class="small" id="controlsText"></p>
</div>
<div id="loader">
  <div class="logo">EGG <span class="egg">🥚</span> THIEF</div>
  <div id="bar"><i></i></div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
