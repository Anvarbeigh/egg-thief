<!doctype html>

<title>Egg Thief</title>
<style>

    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Nunito; font-weight: 700 900; font-display: swap; src: url(./assets/fonts/nunito-cyrillic.woff2) format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  :root {

    --navy: #1d2942; --navy2: #2a3a5e; --ol: #101827; --cream: #fff8e6; --gold: #ffc94d; --gold-d: #c98d14;
    --green: #55c879; --green-d: #2f8a4f; --coral: #f16e60; --coral-d: #a8413a; --blue: #4e8bea; --blue-d: #2c5aa8;
    --orange: #ffa63d; --orange-d: #b9661a; --pink: var(--coral); --pink-d: var(--coral-d); --purple: var(--navy2); --purple-d: var(--ol); --red: var(--coral); --red-d: var(--coral-d);
    --line: rgba(255,248,230,.14);
  }
  body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #8fd0ff; font-family: Nunito, "Trebuchet MS", system-ui, sans-serif; touch-action: none; color: var(--cream); }
  canvas#game { display: block; width: 100%; height: 100%; }
  button { font-family: inherit; }
  .hidden { display: none !important; }
  .i { display: inline-grid; width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }
  .i svg { width: 100%; height: 100%; overflow: visible; }
  /* outlined game text: dark rim + hard drop, the same on every label */
  .ot { text-shadow: 2px 0 0 var(--ol), -2px 0 0 var(--ol), 0 2px 0 var(--ol), 0 -2px 0 var(--ol), 1.5px 1.5px 0 var(--ol), -1.5px 1.5px 0 var(--ol), 1.5px -1.5px 0 var(--ol), -1.5px -1.5px 0 var(--ol), 0 4px 0 var(--ol); }

  /* buttons: solid colour, 3px dark outline, hard shadow */
  .btn { border: 3px solid var(--ol); border-radius: 12px; padding: 9px 16px; font-weight: 900; font-size: 17px; color: var(--cream); cursor: pointer; position: relative;
         background: var(--c, var(--blue)); box-shadow: inset 0 -4px 0 var(--d, var(--blue-d)), 0 4px 0 var(--ol); text-shadow: 0 2px 0 rgba(16,24,39,.55);
         display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .06s, filter .15s; }
  .btn:active { transform: translateY(3px); box-shadow: inset 0 -2px 0 var(--d, var(--blue-d)), 0 1px 0 var(--ol); }
  .btn:disabled { filter: grayscale(.85) brightness(.8); cursor: default; }
  .btn.green { --c: var(--green); --d: var(--green-d); } .btn.orange { --c: var(--orange); --d: var(--orange-d); }
  .btn.pink, .btn.red { --c: var(--coral); --d: var(--coral-d); } .btn.purple, .btn.navy { --c: var(--navy2); --d: var(--ol); } .btn.gold { --c: var(--gold); --d: var(--gold-d); color: var(--ol); text-shadow: none; }

  /* loading + title */
  #loader, #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; z-index: 30; }
  #loader { background: linear-gradient(#7cc8ff, #b9e6ff); }
  .logo { font-size: clamp(44px, 9vw, 88px); font-weight: 900; letter-spacing: 1px; line-height: .95; color: var(--cream); transform: rotate(-3deg);
          text-shadow: 4px 0 0 var(--ol), -4px 0 0 var(--ol), 0 4px 0 var(--ol), 0 -4px 0 var(--ol), 3px 3px 0 var(--ol), -3px 3px 0 var(--ol), 3px -3px 0 var(--ol), -3px -3px 0 var(--ol), 0 9px 0 var(--ol); }
  .logo .egg { display: inline-block; animation: wob 1.4s ease-in-out infinite; }
  .logo .egg .i { width: .9em; height: .9em; vertical-align: -0.08em; filter: drop-shadow(0 6px 0 var(--ol)); }
  @keyframes wob { 0%,100% { transform: rotate(-10deg) } 50% { transform: rotate(10deg) } }
  #bar { width: min(360px, 80vw); height: 22px; border-radius: 10px; background: var(--navy); overflow: hidden; border: 3px solid var(--ol); }
  #bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
  #start { background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.1), rgba(10,20,50,.5)); }
  #start p { margin: 0; max-width: 560px; font-size: 19px; font-weight: 900;
             text-shadow: 2px 0 0 var(--ol), -2px 0 0 var(--ol), 0 2px 0 var(--ol), 0 -2px 0 var(--ol), 1.5px 1.5px 0 var(--ol), -1.5px 1.5px 0 var(--ol), 1.5px -1.5px 0 var(--ol), -1.5px -1.5px 0 var(--ol), 0 3px 0 var(--ol); }
  #start .small { font-size: 14px; opacity: .95; font-weight: 700; }
  #btnPlay { font-size: 32px; padding: 14px 58px; border-radius: 14px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.05) } }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #stats { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .chip { background: var(--navy); border: 3px solid var(--ol); border-radius: 12px; box-shadow: 0 4px 0 var(--ol); padding: 3px 12px 3px 5px; font-weight: 900; font-size: 18px;
          display: flex; align-items: center; gap: 7px; }

  #coinChip .ic, #coinChip .ic .i { width: 36px; height: 36px; }
  #coinChip.bump { animation: bump .25s; }
  @keyframes bump { 50% { transform: scale(1.12) } }
  .cn { display: inline-grid; width: 1em; height: 1em; vertical-align: -0.14em; margin: 0 .08em; }
  .cn svg { width: 100%; height: 100%; overflow: visible; }
  .chip small { font-size: 13px; opacity: .85; }
  #side { position: absolute; right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 10px; pointer-events: auto; align-items: flex-end; }
  .sbtn { width: 58px; height: 58px; border-radius: 12px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1; --c: var(--navy); --d: var(--ol); }
  .sbtn .i { width: 30px; height: 30px; }
  .sbtn span:not(.i) { font-size: 10px; font-weight: 900; letter-spacing: .3px; text-transform: uppercase; max-width: 54px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot::after { content: ""; position: absolute; top: -6px; right: -6px; width: 14px; height: 14px; border-radius: 50%; background: var(--coral); border: 3px solid var(--ol); animation: pulse 1s infinite; }
  #gear { width: 42px; height: 42px; padding: 0; border-radius: 12px; --c: var(--navy); --d: var(--ol); }
  #gear .i { width: 24px; height: 24px; }

  /* objective: one slot at the top, short words */
  #tut { position: absolute; left: 50%; transform: translateX(-50%); top: max(12px, env(safe-area-inset-top)); min-width: 260px; max-width: min(420px, calc(100vw - 200px));
         background: var(--navy); color: var(--cream); font-weight: 900; font-size: 20px; letter-spacing: .4px; text-transform: uppercase; padding: 8px 20px; border-radius: 12px;
         border: 3px solid var(--ol); box-shadow: inset 0 -4px 0 var(--ol), 0 4px 0 var(--ol); text-align: center; animation: tutIn .35s; z-index: 1; }
  #tut b { color: var(--gold); }
  @keyframes tutIn { from { translate: 0 -20px; opacity: 0 } }
  #zonehint { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%); text-align: center; font-weight: 900; font-size: 18px;
              background: var(--navy); border: 3px solid var(--ol); padding: 6px 16px; border-radius: 12px; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #zonehint.show { opacity: 1; } #zonehint.bad { color: #ffb0a6; } #zonehint.ok { color: #a7f0bd; }
  #carry { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 22px; background: var(--coral); border: 3px solid var(--ol); text-transform: uppercase;
           padding: 8px 22px; border-radius: 12px; display: none; animation: pulse .8s infinite; box-shadow: inset 0 -4px 0 var(--coral-d), 0 4px 0 var(--ol); }
  #carry .i { width: 26px; height: 26px; margin-right: 6px; }
  #msgs { display: contents; }
  #toasts { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .toast { font-weight: 900; font-size: 30px; padding: 2px 10px; animation: pop 2.2s forwards; white-space: nowrap; text-transform: uppercase;
           text-shadow: 2px 0 0 var(--ol), -2px 0 0 var(--ol), 0 2px 0 var(--ol), 0 -2px 0 var(--ol), 2px 2px 0 var(--ol), -2px 2px 0 var(--ol), 2px -2px 0 var(--ol), -2px -2px 0 var(--ol), 0 5px 0 var(--ol); }
  .toast .i, .toast .cn { filter: drop-shadow(0 3px 0 var(--ol)); }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 10% { transform: scale(1.12); opacity: 1 } 18% { transform: scale(1) } 80% { opacity: 1 } 100% { opacity: 0; transform: translateY(-30px) } }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(40,20,0,.22) 100%); }
  #speedlines { position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0; transition: opacity .35s;
    background: repeating-conic-gradient(from 0deg at 50% 55%, rgba(255,255,255,.0) 0deg 5deg, rgba(255,255,255,.55) 5.4deg, rgba(255,255,255,0) 6deg 11deg);
    -webkit-mask-image: radial-gradient(ellipse at 50% 55%, transparent 52%, #000 85%); mask-image: radial-gradient(ellipse at 50% 55%, transparent 52%, #000 85%); animation: sl .25s steps(2) infinite; }
  @keyframes sl { 50% { transform: rotate(2.5deg) scale(1.03); } }
  #flash { position: fixed; inset: 0; background: #ff3030; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 11; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 11; }

  /* touch controls: the joystick appears where the left thumb lands */
  #touchzone { position: absolute; left: 0; bottom: 0; width: 50%; height: 65%; pointer-events: auto; display: none; touch-action: none; }
  #joy { position: absolute; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; background: rgba(29,41,66,.35); border: 3px solid rgba(16,24,39,.7); display: none; pointer-events: none; }
  #joy.idle { display: block; left: 110px; bottom: 60px; top: auto; margin: 0; opacity: .55; }
  #joyknob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: var(--cream); border: 3px solid var(--ol); box-shadow: 0 4px 0 var(--ol); }
  #jumpbtn { position: absolute; right: max(26px, env(safe-area-inset-right)); bottom: max(36px, env(safe-area-inset-bottom)); width: 96px; height: 96px; border-radius: 50%; font-size: 16px;
             pointer-events: auto; display: none; touch-action: none; font-size: 18px; --c: var(--orange); --d: var(--orange-d); }
  body.touch #touchzone, body.touch #jumpbtn { display: block; }
  body.touch #carry { bottom: 150px; }

  /* panels */
  .panel { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8,12,30,.5); pointer-events: auto; z-index: 20; padding: 12px; }
  .panel.open { display: flex; animation: fadeIn .15s; }
  @keyframes fadeIn { from { opacity: 0 } }
  .box { background: var(--navy); border-radius: 16px; padding: 16px; width: min(580px, 100%); max-height: calc(100% - 10px); overflow: auto;
         border: 3px solid var(--ol); box-shadow: inset 0 0 0 3px var(--navy2), 0 6px 0 var(--ol), 0 14px 40px rgba(0,0,0,.35); animation: boxIn .2s cubic-bezier(.2,1.6,.4,1); }
  @keyframes boxIn { from { transform: scale(.85) } }
  .box h2 { margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: .5px; }
  .box h2 > span { display: inline-flex; align-items: center; gap: 10px; } .box h2 .i { width: 32px; height: 32px; }
  .box h2 .btn { padding: 0; width: 44px; height: 44px; } .box h2 .btn .i { width: 22px; height: 22px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; background: var(--navy2); margin-bottom: 8px; border: 2px solid var(--ol); }
  .row .ico { width: 50px; height: 50px; border-radius: 10px; display: grid; place-items: center; font-size: 28px; background: #e9eef8; border: 2px solid var(--ol); flex: none; }
  .row .ico .i { width: 32px; height: 32px; }
  .row .txt { flex: 1; min-width: 0; }
  .row .txt b { display: block; font-size: 17px; font-weight: 900; }
  /* the upgrade that matters most (speed) leads the shop: bigger, gold rim */
  .row.feat { border: 3px solid var(--gold); padding: 14px 12px; background: #34477a; box-shadow: 0 4px 0 var(--ol); margin-bottom: 12px; }
  .row.feat .ico { width: 62px; height: 62px; } .row.feat .ico .i { width: 42px; height: 42px; }
  .row.feat .txt b { font-size: 22px; color: var(--gold); text-transform: uppercase; }
  .row.feat .btn { font-size: 20px; padding: 10px 18px; }
  .row .txt span { font-size: 13px; opacity: .85; font-weight: 700; }
  .row .btn { padding: 9px 13px; font-size: 15px; white-space: nowrap; }
  .empty { opacity: .75; text-align: center; padding: 22px; font-weight: 600; }
  .note { font-size: 14px; opacity: .85; margin: 6px 2px 12px; font-weight: 500; line-height: 1.4; }
  .big { font-size: 20px; padding: 14px 22px; width: 100%; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .cell { border-radius: 12px; padding: 8px 4px; text-align: center; background: var(--navy2); font-size: 12px; font-weight: 700; border: 2px solid var(--rc, transparent); }
  .cell .em { font-size: 30px; display: block; margin-bottom: 2px; }
  .cell.locked { opacity: .45; filter: grayscale(1); }
  .cell .gd { color: var(--gold); font-size: 11px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 8px 0 12px; }
  .day { border-radius: 10px; background: var(--navy2); border: 2px solid var(--ol); padding: 8px 2px; text-align: center; font-size: 11px; font-weight: 800; }
  .day.got { background: rgba(63,207,94,.35); } .day.now { background: rgba(255,197,49,.4); outline: 3px solid var(--gold); }
  .toggle { display: flex; justify-content: space-between; align-items: center; }

  /* hatch reveal */
  #reveal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 25; pointer-events: none; background: rgba(8,12,30,.35); }
  #reveal.open { display: flex; }
  #reveal .rays { position: absolute; width: 640px; height: 640px; border-radius: 50%; background: repeating-conic-gradient(var(--rc) 0 10deg, transparent 10deg 20deg); opacity: .35; animation: spin 8s linear infinite;
                  mask: radial-gradient(circle, #000 20%, transparent 70%); -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%); }
  @keyframes spin { to { transform: rotate(360deg) } }
  #reveal .card { position: relative; text-align: center; animation: cardIn .45s cubic-bezier(.2,1.8,.4,1); }
  @keyframes cardIn { from { transform: scale(.2) rotate(-12deg); opacity: 0 } }
  #reveal .rname { font-size: clamp(30px, 7vw, 54px); font-weight: 900; text-transform: uppercase; text-shadow: 3px 0 0 var(--ol), -3px 0 0 var(--ol), 0 3px 0 var(--ol), 0 -3px 0 var(--ol), 2px 2px 0 var(--ol), -2px 2px 0 var(--ol), 2px -2px 0 var(--ol), -2px -2px 0 var(--ol), 0 6px 0 var(--ol); }
  #reveal .rrar { display: inline-block; font-size: 20px; font-weight: 900; padding: 4px 16px; border-radius: 10px; background: var(--rc); border: 3px solid var(--ol); box-shadow: 0 4px 0 var(--ol); margin: 6px 0; }
  #reveal .rinc { font-size: 22px; font-weight: 800; color: var(--gold); }
  #reveal .rnew { position: absolute; top: -34px; right: 0; background: var(--coral); padding: 4px 12px; border-radius: 10px; border: 3px solid var(--ol); font-weight: 900; transform: rotate(12deg); box-shadow: 0 4px 0 var(--ol); }
  #reveal .tap { margin-top: 14px; font-size: 14px; opacity: .8; }

  /* ---- Toybox Farm skin (approved mockups, 2026-11-08) ----
     warm wood plates, cream parchment, glossy chunky buttons, painted icons (assets/ui/ic).
     Everything above sets layout; this block sets the look. */
  :root {
    --ink: #5b3a1f; --ink2: #8a5a2e; --woodb: #5e3415;
    --wood: linear-gradient(180deg, #d4924f 0%, #b56f34 52%, #985825 100%);
    --parch: linear-gradient(180deg, #fffaf0, #fbe8c0);
    --bstroke: 2px 0 0 #4a2a10, -2px 0 0 #4a2a10, 0 2px 0 #4a2a10, 0 -2px 0 #4a2a10, 1.5px 1.5px 0 #4a2a10, -1.5px 1.5px 0 #4a2a10, 1.5px -1.5px 0 #4a2a10, -1.5px -1.5px 0 #4a2a10, 0 3px 0 #4a2a10;
  }
  .i img, .cn img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .cn { width: 1.1em; height: 1.1em; vertical-align: -0.2em; }
  .i { width: 1.3em; height: 1.3em; vertical-align: -0.28em; }
  .ot { text-shadow: var(--bstroke); }

  /* glossy chunky buttons */
  .btn { --g1: #fff19a; --g2: #ffd43a; --g3: #f5a812; --bb: #9a5a0a; --bs: #6e3f06; --st: #8a4a06;
         border: 3px solid var(--bb); border-radius: 16px; padding: 8px 18px; min-height: 48px; color: #fff; font-weight: 900; font-size: 19px; letter-spacing: .2px;
         background: linear-gradient(180deg, var(--g1) 0%, var(--g2) 46%, var(--g3) 100%);
         box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(0,0,0,.14), 0 4px 0 var(--bs), 0 6px 10px rgba(60,30,0,.25);
         text-shadow: 2px 0 0 var(--st), -2px 0 0 var(--st), 0 2px 0 var(--st), 0 -2px 0 var(--st), 1.5px 1.5px 0 var(--st), -1.5px 1.5px 0 var(--st), 1.5px -1.5px 0 var(--st), -1.5px -1.5px 0 var(--st), 0 3px 0 var(--st); }
  .btn:active { transform: translateY(3px); box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(0,0,0,.14), 0 1px 0 var(--bs); }
  .btn .i, .btn .cn { filter: drop-shadow(0 2px 0 rgba(70,35,0,.35)); }
  .btn.green { --g1: #b9f56c; --g2: #72de29; --g3: #35b819; --bb: #24680f; --bs: #1d5409; --st: #1f6a10; }
  .btn.orange, .btn.gold { --g1: #fff19a; --g2: #ffd43a; --g3: #f5a812; --bb: #9a5a0a; --bs: #6e3f06; --st: #8a4a06; }
  .btn.pink, .btn.red { --g1: #ffb2a6; --g2: #f0564a; --g3: #c93a30; --bb: #7d1a14; --bs: #5e120d; --st: #8a1f18; }
  .btn.purple, .btn.navy { --g1: #b9e2ff; --g2: #56a8f2; --g3: #2f78d6; --bb: #1b4a8a; --bs: #143766; --st: #1b4a8a; }
  .btn:disabled { filter: none; --g1: #f1ece2; --g2: #cfc8bb; --g3: #b0a899; --bb: #7d7468; --bs: #5c554c; --st: #7d7468; }

  /* HUD chips: wood plates with a painted icon hanging over the left edge */
  #stats { gap: 8px; }
  .chip { background: var(--wood); border: 3px solid var(--woodb); border-radius: 14px; padding: 2px 14px 2px 4px; min-height: 40px; gap: 6px; color: #fff; font-size: 21px;
          box-shadow: inset 0 2px 0 rgba(255,230,180,.45), inset 0 -3px 0 rgba(70,35,10,.3), 0 3px 0 #4a2a10, 0 5px 8px rgba(0,0,0,.2); text-shadow: var(--bstroke); }
  .chip .ic, .chip .ic .i { width: 32px; height: 32px; }
  #coinChip { font-size: 28px; color: #ffe066; padding-left: 0; min-height: 50px; }
  #coinChip > .ic { margin-left: -8px; } #coinChip > .ic, #coinChip > .ic .i { width: 50px; height: 50px; }
  .chip small { font-size: 15px; opacity: 1; }
  .chip.lt { background: var(--parch); border-color: #b9824a; color: var(--ink); text-shadow: none; box-shadow: inset 0 -3px 0 rgba(185,130,74,.3), 0 3px 0 rgba(94,52,21,.55); }
  #speedChip .arr { font-size: .75em; color: var(--ink2); }
  #spdNext { display: inline-flex; align-items: center; gap: 3px; } #spdNext .i { width: 32px; height: 32px; }
  #boostChip { color: #fff; } #boostChip .ic, #boostChip .ic .i { width: 40px; height: 34px; }

  <div id="stats">

    <div class="chip hidden" id="incomeChip"><span class="ic" data-icon="income"></span><span id="income">0</span><small data-t="perSec"></small></div>
    <div class="chip lt" id="speedChip"><span class="ic" data-icon="speed"></span><span id="spdNow"></span><b class="arr">&#10132;</b><span id="spdNext"></span></div>
    <div class="chip hidden" id="boostChip"><span class="ic" data-icon="boost"></span><span id="boostTime"></span></div>
    <div class="chip hidden" id="rbChip"><span class="ic" data-icon="rebirth"></span><span id="rbText"></span></div>
  </div>
  <div id="msgs"><div id="tut" class="hidden"></div><div id="zonehint"></div><div id="carry"></div></div>
  <div id="toasts"></div>
  <div id="touchzone"><div id="joy"><div id="joyknob"></div></div></div>
  <button class="btn" id="jumpbtn" aria-label="Jump"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 21 12.5h-5.2V21H8.2v-8.5H3z" fill="#fff" stroke="#8a4a06" stroke-width="2" stroke-linejoin="round"/></svg></button>
  <div id="side">
    <button class="btn sbtn" id="btnShop" data-icon="shop"><span data-t="shop"></span></button>
    <button class="btn sbtn" id="btnPets" data-icon="pets"><span data-t="pets"></span></button>
    <button class="btn sbtn hidden" id="btnIndex" data-icon="index"><span data-t="sideIndex"></span></button>
    <button class="btn sbtn hidden" id="btnGift" data-icon="gift"><span data-t="gift"></span></button>
    <button class="btn sbtn hidden" id="btnRebirth" data-icon="rebirth"><span data-t="sideRebirth"></span></button>
    <button class="btn" id="gear" data-icon="gear"></button>
  </div>
</div>

<div class="panel" id="shopPanel"><div class="box"><div class="bal" id="shopBal"></div><h2><span data-icon="shop"><span data-t="shop"></span></span><button class="btn red" data-close data-icon="close"></button></h2><div id="shopList"></div></div></div>
<div class="panel" id="petsPanel"><div class="box"><h2><span data-icon="pets"><span data-t="yourPens"></span><span class="cnt" id="petsCount"></span></span><button class="btn red" data-close data-icon="close"></button></h2><div class="note hint hidden" id="petsHint" data-t="pensAllDesc"></div><div id="petsList"></div></div></div>
<div class="panel" id="indexPanel"><div class="box"><h2><span data-icon="index"><span data-t="indexTitle"></span></span><button class="btn red" data-close data-icon="close"></button></h2><div class="note" id="indexNote"></div><div class="grid" id="indexGrid"></div></div></div>
<div class="panel" id="rebirthPanel"><div class="box"><h2><span data-icon="rebirth"><span data-t="rebirthTitle"></span></span><button class="btn red" data-close data-icon="close"></button></h2><div id="rebirthBody"></div></div></div>
<div class="panel" id="giftPanel"><div class="box"><h2><span data-icon="gift"><span data-t="giftTitle"></span></span><button class="btn red" data-close data-icon="close"></button></h2><div id="giftBody"></div></div></div>
<div class="panel" id="awayPanel"><div class="box" style="text-align:center"><h2 style="justify-content:center"><span data-icon="moon"><span data-t="away"></span></span></h2><div id="awayBody"></div></div></div>
<div class="panel" id="caughtPanel"><div class="box" style="text-align:center"><h2 style="justify-content:center"><span data-icon="caught"><span data-t="caughtTitle"></span></span></h2><p class="note" data-t="caughtText"></p><button class="btn green" id="btnCaughtOk" data-t="continue" style="font-size:22px;padding:12px 40px"></button></div></div>
<div class="panel" id="settingsPanel"><div class="box"><h2><span data-icon="gear"><span data-t="settings"></span></span><button class="btn red" data-close data-icon="close"></button></h2><div id="settingsBody"></div></div></div>

<div id="goaldone"><div class="gd1"></div><div class="gd2"></div></div>
<div id="reveal"><div class="rays"></div><div class="card"><div class="rnew hidden" data-t="newPet"></div><div class="rimg"></div><div class="rname"></div><div class="rrar"></div><div class="rinc"></div></div></div>

<div id="start" class="hidden">
  <img class="logoimg" id="logo" alt="" draggable="false">
  <p class="slogan" data-t="tagline"></p>
  <button class="btn green" id="btnPlay"><span data-t="play"></span></button>
  <p class="small" id="controlsText"></p>
  <button class="btn tgear" id="titleGear" data-icon="gear" aria-label="Settings"></button>
</div>
<div id="loader">
  <div class="logo">EGG THIEF</div>
  <div id="bar"><i></i></div>
</div>

<script type="module" src="./main.js"></script>
</body>
